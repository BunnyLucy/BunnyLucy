<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 250" width="290" height="250" role="img" aria-label="the typewriter: a retro typewriter that is also my homepage. type a key, leave a note."><title>the typewriter: a retro typewriter that is also my homepage. type a key, leave a note.</title>
<defs>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="12" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="t"/>
    <feColorMatrix in="t" type="matrix" values="0 0 0 0 0.37  0 0 0 0 0.34  0 0 0 0 0.30  0 0 0 0.09 0"/>
  </filter>
</defs>
