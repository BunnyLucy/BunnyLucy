<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-label="About Yishu: software engineering student into HCI and creative technology."><title>About Yishu: software engineering student into HCI and creative technology.</title>
<defs>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="5" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="t"/>
    <feColorMatrix in="t" type="matrix" values="0 0 0 0 0.37  0 0 0 0 0.34  0 0 0 0 0.30  0 0 0 0.09 0"/>
  </filter>
</defs>
<rect x="3" y="3" width="954" height="324" rx="16" fill="#f6f1e6"/><rect x="3" y="3" width="954" height="324" rx="16" filter="url(#grain)"/><rect x="4" y="4" width="952" height="322" rx="16" fill="none" stroke="#1f1b17" stroke-width="1.6" filter="url(#rough)"/>
<rect x="60" y="30" width="600" height="276" fill="#fffdf7" stroke="#1f1b17" stroke-width="1.4" filter="url(#rough)" transform="rotate(-0.6 360 168)"/>
<g stroke="#ebe4d6" stroke-width="1"><line x1="80" y1="104" x2="640" y2="104"/><line x1="80" y1="126" x2="640" y2="126"/><line x1="80" y1="148" x2="640" y2="148"/><line x1="80" y1="170" x2="640" y2="170"/><line x1="80" y1="192" x2="640" y2="192"/><line x1="80" y1="214" x2="640" y2="214"/><line x1="80" y1="236" x2="640" y2="236"/><line x1="80" y1="258" x2="640" y2="258"/><line x1="80" y1="280" x2="640" y2="280"/></g>
<line x1="78" y1="40" x2="78" y2="296" stroke="#f3aa87" stroke-width="1" opacity="0.7"/>
<text x="88" y="66" font-family="'Special Elite','Courier Prime','Courier New',Courier,monospace" font-size="15" letter-spacing="4" fill="#1f1b17">ABOUT —</text>
<g font-family="'Courier Prime','Courier New',Courier,monospace" font-size="14.5" fill="#302a26"><text x="88" y="98" xml:space="preserve">Hi! I'm Yishu — a software engineering student</text><text x="88" y="120" xml:space="preserve">who would rather build stories than features.</text><text x="88" y="142" xml:space="preserve"></text><text x="88" y="164" xml:space="preserve">I care about human-centered computing, HCI and</text><text x="88" y="186" xml:space="preserve">creative technology: the corner where code learns</text><text x="88" y="208" xml:space="preserve">to feel a little more human.</text><text x="88" y="230" xml:space="preserve"></text><text x="88" y="252" xml:space="preserve">Lately: typewriters that talk back, a tiny 3D island,</text><text x="88" y="274" xml:space="preserve">AI workflows, and a stack of scrappy MVPs.</text></g>
<text x="612" y="292" text-anchor="end" font-family="'Caveat','Bradley Hand','Segoe Print','Chalkboard SE','Comic Sans MS',cursive" font-size="20" fill="#5f574e">— yishu</text>
<g font-family="'Courier Prime','Courier New',Courier,monospace" font-size="13" fill="#302a26">
  <text x="700" y="64" font-family="'Special Elite','Courier Prime','Courier New',Courier,monospace" font-size="13" letter-spacing="3" fill="#1f1b17">FIELD NOTES</text>
  <path d="M700 72 Q760 76 836 70" fill="none" stroke="#1f1b17" stroke-width="1.4" stroke-linecap="round"/>
  <text x="700" y="104">✎  SE undergrad, class of '29</text>
  <text x="700" y="132">✎  design lead @ campus lab</text>
  <text x="700" y="160">✎  HCI · creative tech</text>
  <text x="700" y="188">✎  Blender → Three.js</text>
  <text x="700" y="216">✎  writes · sketches · ships</text>
</g>
