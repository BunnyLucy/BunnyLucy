name: redraw doodles

on:
  schedule:
    - cron: "17 16 * * *" # 00:17 in Shanghai
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/doodles.yml"]

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fonts toolkit
        run: pip install --quiet fonttools brotli
      - name: draw
        run: python3 scripts/doodles.py
        env:
          GITHUB_TOKEN: ${{ secrets.DOODLE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doodles
          git diff --cached --quiet || (git commit -m "redraw doodles ✎" && git push)
